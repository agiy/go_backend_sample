name: go_backend_sample

services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_admin
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C --auth-host=scram-sha-256 --data-checksums
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      # PostgreSQL 18の公式イメージはバージョン別のPGDATAをこの配下へ作る。
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d go_backend_sample_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC", "-c", "password_encryption=scram-sha-256"]

volumes:
  postgres_data:
