root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ."
  entrypoint = ["./tmp/server"]
  delay = 500
  exclude_dir = [".git", ".idea", "bin", "storage", "tmp", "tools"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "html", "tpl", "tmpl"]
  include_file = [".env", "go.mod", "go.sum"]
  stop_on_error = true
  send_interrupt = true
  kill_delay = "5s"
  log = "build-errors.log"

[log]
  time = true

[misc]
  clean_on_exit = true
